<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Joao's Capoeira Event — Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e17;
    --surface: #1a1828;
    --surface2: #221f35;
    --border: #2e2a45;
    --border-light: #252240;
    --text: #fffffe;
    --text-muted: #a09dc0;
    --text-faint: #5a5778;
    --yellow: #f9c846;
    --yellow-dark: #b8920a;
    --yellow-bg: #2a2410;
    --pink: #ff6b9d;
    --pink-dark: #c0326a;
    --pink-bg: #2a1020;
    --teal: #43ffdd;
    --teal-dark: #0a9e80;
    --teal-bg: #0a2420;
    --orange: #ff8c42;
    --orange-dark: #b85010;
    --orange-bg: #2a1a0a;
    --purple: #b388ff;
    --purple-dark: #6030c0;
    --purple-bg: #1e1530;
    --blue: #64b5f6;
    --blue-dark: #1565c0;
    --blue-bg: #0a1828;
    --gray-light: #2a2840;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius: 6px;
    --radius-lg: 12px;
  }

  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2.5rem 1rem 5rem;
  }

  body::before {
    content: '';
    display: block;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--yellow), var(--pink), var(--teal), var(--orange), var(--purple), var(--blue), var(--yellow));
    background-size: 200%;
    animation: stripe 6s linear infinite;
    z-index: 100;
  }
  @keyframes stripe { to { background-position: 200% 0; } }

  .page { max-width: 800px; margin: 0 auto; }

  header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .event-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.05;
    color: var(--text);
  }
  h1 .cap { color: var(--pink); }

  .header-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    display: inline-block;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .sync-dot.syncing  { background: var(--yellow); animation: pulse 1s infinite; }
  .sync-dot.synced   { background: var(--teal); }
  .sync-dot.error    { background: var(--pink); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 2rem;
  }

  .metric {
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
    border: 1px solid;
  }
  .metric-total    { background: var(--yellow-bg); border-color: var(--yellow-dark); }
  .metric-owed     { background: var(--pink-bg);   border-color: var(--pink-dark); }
  .metric-settled  { background: var(--teal-bg);   border-color: var(--teal-dark); }

  .metric-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .metric-total .metric-label   { color: var(--yellow); }
  .metric-owed .metric-label    { color: var(--pink); }
  .metric-settled .metric-label { color: var(--teal); }

  .metric-value {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }
  .metric-total .metric-value   { color: var(--yellow); }
  .metric-owed .metric-value    { color: var(--pink); }
  .metric-settled .metric-value { color: var(--teal); }

  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.75rem;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 1.1rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: flex-end;
  }

  .field label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus, select:focus { border-color: var(--orange); background: var(--bg); }

  .btn-row { display: flex; gap: 8px; }

  button {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border-radius: var(--radius);
    border: 1px solid;
    padding: 9px 18px;
    transition: all 0.15s;
    letter-spacing: 0.06em;
  }

  .btn-primary { background: var(--orange); color: var(--bg); border-color: var(--orange); }
  .btn-primary:hover { background: var(--yellow); border-color: var(--yellow); color: var(--bg); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
  }

  thead { background: var(--surface2); }

  th {
    padding: 10px 12px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  th.r, td.r { text-align: right; }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: var(--surface);
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }

  .col-date { width: 90px; }
  .col-desc { width: auto; }
  .col-cat  { width: 125px; }
  .col-amt  { width: 95px; }
  .col-stat { width: 95px; }
  .col-del  { width: 38px; }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid;
  }
  .cat-entry         { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-dark); }
  .cat-food          { background: var(--teal-bg);   color: var(--teal);   border-color: var(--teal-dark); }
  .cat-transport     { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-dark); }
  .cat-accommodation { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-dark); }
  .cat-gear          { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-dark); }
  .cat-other         { background: var(--gray-light);color: var(--text-muted); border-color: var(--border); }

  .status-btn {
    padding: 3px 9px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid;
    font-family: var(--font-mono);
    transition: all 0.15s;
  }
  .status-pending { background: var(--pink-bg); color: var(--pink); border-color: var(--pink-dark); }
  .status-paid    { background: var(--teal-bg); color: var(--teal); border-color: var(--teal-dark); }
  .status-pending:hover { background: var(--pink); color: var(--bg); border-color: var(--pink); }
  .status-paid:hover    { background: var(--teal); color: var(--bg); border-color: var(--teal); }

  .del-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 18px;
    padding: 2px 4px;
    cursor: pointer;
    line-height: 1;
    transition: color 0.15s;
  }
  .del-btn:hover { color: var(--pink); }

  .empty-row td {
    text-align: center;
    padding: 3rem;
    color: var(--text-faint);
    font-style: italic;
    font-size: 13px;
    background: var(--surface);
  }

  .footer {
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 2rem;
    letter-spacing: 0.04em;
  }

  .totals-row td {
    border-top: 1px solid var(--border);
    font-weight: 700;
    background: var(--surface2);
    color: var(--yellow);
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 50;
    transition: opacity 0.4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text-muted); font-size: 13px; letter-spacing: 0.08em; }

  @media (max-width: 560px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .summary .metric:last-child { grid-column: span 2; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .field:first-child { grid-column: span 2; }
    .col-cat, .col-date { display: none; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Connecting to Firebase...</div>
</div>

<div class="page">
  <header>
    <p class="event-label">// Expense log</p>
    <h1>Joao's <span class="cap">capoeira</span> event</h1>
    <p class="header-meta">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-status">Connecting...</span>
    </p>
  </header>

  <div class="summary">
    <div class="metric metric-total">
      <div class="metric-label">Total paid</div>
      <div class="metric-value" id="s-total">€0.00</div>
    </div>
    <div class="metric metric-owed">
      <div class="metric-label">Joao owes</div>
      <div class="metric-value" id="s-owed">€0.00</div>
    </div>
    <div class="metric metric-settled">
      <div class="metric-label">Settled</div>
      <div class="metric-value" id="s-settled">€0.00</div>
    </div>
  </div>

  <div class="add-section">
    <p class="section-title">Add expense</p>
    <div class="form-grid">
      <div class="field"><label>Description</label><input type="text" id="f-desc" placeholder="e.g. Event entry fee" /></div>
      <div class="field"><label>Amount (€)</label><input type="number" id="f-amt" placeholder="0.00" min="0" step="0.01" /></div>
      <div class="field"><label>Date</label><input type="date" id="f-date" /></div>
    </div>
    <div class="form-grid-2">
      <div class="field"><label>Category</label>
        <select id="f-cat">
          <option value="entry">Entry fee</option>
          <option value="food">Food &amp; drinks</option>
          <option value="transport">Transport</option>
          <option value="accommodation">Accommodation</option>
          <option value="gear">Gear / equipment</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-ghost" onclick="clearForm()">Clear</button>
        <button class="btn-primary" id="btn-add" onclick="addEntry()">+ Add</button>
      </div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-date">Date</th>
            <th class="col-desc">Description</th>
            <th class="col-cat">Category</th>
            <th class="col-amt r">Amount</th>
            <th class="col-stat">Status</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </div>
  </div>

  <p class="footer">Synced with Firebase · updates on all devices in real time</p>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, push, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDAb10xQOiyLuDXRqOrT93SS3FWLsUzQfQ",
    authDomain: "joao-expenses.firebaseapp.com",
    databaseURL: "https://joao-expenses-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "joao-expenses",
    storageBucket: "joao-expenses.firebasestorage.app",
    messagingSenderId: "936297862127",
    appId: "1:936297862127:web:e6450750891bd61578dc1a"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const expensesRef = ref(db, 'expenses');

  const CAT_LABELS = {
    entry: 'Entry fee', food: 'Food & drinks', transport: 'Transport',
    accommodation: 'Accommodation', gear: 'Gear', other: 'Other'
  };

  function setSyncStatus(state, msg) {
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-status');
    dot.className = 'sync-dot ' + state;
    txt.textContent = msg;
  }

  function today() { return new Date().toISOString().split('T')[0]; }
  document.getElementById('f-date').value = today();

  // Listen for real-time updates
  onValue(expensesRef, (snapshot) => {
    const data = snapshot.val() || {};
    const expenses = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    expenses.sort((a, b) => b.date.localeCompare(a.date));
    render(expenses);
    setSyncStatus('synced', 'Synced · live');
    document.getElementById('loading').classList.add('hidden');
  }, (error) => {
    setSyncStatus('error', 'Connection error');
    document.getElementById('loading').classList.add('hidden');
  });

  window.addEntry = async function() {
    const desc = document.getElementById('f-desc').value.trim();
    const amt  = parseFloat(document.getElementById('f-amt').value);
    const date = document.getElementById('f-date').value;
    const cat  = document.getElementById('f-cat').value;
    if (!desc)            { alert('Please enter a description.'); return; }
    if (!amt || amt <= 0) { alert('Please enter a valid amount.'); return; }
    if (!date)            { alert('Please select a date.'); return; }

    const btn = document.getElementById('btn-add');
    btn.disabled = true;
    setSyncStatus('syncing', 'Saving...');
    try {
      await push(expensesRef, { desc, amt, date, cat, paid: false });
      clearForm();
    } catch(e) {
      alert('Error saving. Check your connection.');
      setSyncStatus('error', 'Save failed');
    }
    btn.disabled = false;
  };

  window.clearForm = function() {
    document.getElementById('f-desc').value = '';
    document.getElementById('f-amt').value  = '';
    document.getElementById('f-date').value = today();
    document.getElementById('f-cat').value  = 'entry';
  };

  window.togglePaid = async function(id, currentPaid) {
    setSyncStatus('syncing', 'Saving...');
    try {
      await update(ref(db, 'expenses/' + id), { paid: !currentPaid });
    } catch(e) {
      setSyncStatus('error', 'Update failed');
    }
  };

  window.deleteEntry = async function(id) {
    if (!confirm('Remove this expense?')) return;
    setSyncStatus('syncing', 'Deleting...');
    try {
      await remove(ref(db, 'expenses/' + id));
    } catch(e) {
      setSyncStatus('error', 'Delete failed');
    }
  };

  function fmtDate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    return m + '/' + day + '/' + y.slice(2);
  }

  function render(expenses) {
    const tbody = document.getElementById('expense-list');

    if (expenses.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No expenses yet — add one above</td></tr>';
      document.getElementById('s-total').textContent   = '€0.00';
      document.getElementById('s-owed').textContent    = '€0.00';
      document.getElementById('s-settled').textContent = '€0.00';
      return;
    }

    const rows = expenses.map(e => `
      <tr>
        <td class="col-date" style="color:var(--text-muted);font-size:12px">${fmtDate(e.date)}</td>
        <td class="col-desc" title="${e.desc}">${e.desc}</td>
        <td class="col-cat"><span class="badge cat-${e.cat}">${CAT_LABELS[e.cat] || e.cat}</span></td>
        <td class="col-amt r" style="font-weight:700">€${e.amt.toFixed(2)}</td>
        <td class="col-stat">
          <button class="status-btn ${e.paid ? 'status-paid' : 'status-pending'}"
                  onclick="togglePaid('${e.id}', ${e.paid})">
            ${e.paid ? '✓ Paid' : 'Pending'}
          </button>
        </td>
        <td class="col-del"><button class="del-btn" onclick="deleteEntry('${e.id}')" title="Delete">×</button></td>
      </tr>
    `).join('');

    const total   = expenses.reduce((s, e) => s + e.amt, 0);
    const settled = expenses.filter(e => e.paid).reduce((s, e) => s + e.amt, 0);
    const pending = expenses.filter(e => !e.paid).reduce((s, e) => s + e.amt, 0);

    tbody.innerHTML = rows + `
      <tr class="totals-row">
        <td class="col-date"></td>
        <td class="col-desc" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase">Total</td>
        <td class="col-cat"></td>
        <td class="col-amt r">€${total.toFixed(2)}</td>
        <td class="col-stat"></td>
        <td class="col-del"></td>
      </tr>
    `;

    document.getElementById('s-total').textContent   = '€' + total.toFixed(2);
    document.getElementById('s-owed').textContent    = '€' + pending.toFixed(2);
    document.getElementById('s-settled').textContent = '€' + settled.toFixed(2);
  }
</script>
</body>
</html>
